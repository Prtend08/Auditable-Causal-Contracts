    - periodic
    - entropy
    - margin
    - disagreement
    - dynamic_entropy_online
    - ask_or_adapt_v2
  expected_runs: 630
  event_logging: complete
statistics:
  paired_unit: dataset_backbone_stream_seed
  primary_metric: online_accuracy
  secondary_metrics:
    - gain_over_zero_shot
    - worst_window_accuracy
    - negative_adaptation_rate
    - expected_calibration_error
  confidence_interval: stratified_seed_bootstrap_95_percent
